[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".ruff_cache",
    ".pytest_cache",
    "notebooks",
]

[tool.ruff.lint]
# E: pycodestyle errors
# F: Pyflakes
# W: pycodestyle warnings
select = ["E", "F", "W"]
ignore = []

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v"
testpaths = [
    "tests",
]
