name: Dependency Review

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check dependency graph support
        id: dependency-graph
        uses: actions/github-script@v7
        with:
          script: |
            const { data: repo } = await github.rest.repos.get(context.repo);
            const dependencyGraphStatus = repo.security_and_analysis?.dependency_graph?.status;
            const supported = dependencyGraphStatus === 'enabled';
            core.setOutput('supported', String(supported));
            if (!supported) {
              core.notice('Skipping dependency review: dependency graph is disabled or unavailable for this repository.');
            }
      - name: Dependency Review
        if: steps.dependency-graph.outputs.supported == 'true'
        uses: actions/dependency-review-action@v4
      - name: Dependency review skipped
        if: steps.dependency-graph.outputs.supported != 'true'
        run: echo "Dependency review skipped because dependency graph support is unavailable."
