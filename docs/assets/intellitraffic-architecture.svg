<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 428" width="1040" height="428"
     role="img" aria-labelledby="itTitle itDesc"
     font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">

  <title id="itTitle">IntelliTraffic architecture and data flow</title>
  <desc id="itDesc">Real California PeMS traffic data and historical weather flow through the feature
  engine and the LightGBM V2 model, are served by a FastAPI backend, and reach a Vite frontend that
  renders an interactive geospatial traffic map.</desc>

  <defs>
    <!-- Background gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070d18"/>
      <stop offset="55%" stop-color="#0a1524"/>
      <stop offset="100%" stop-color="#05090f"/>
    </linearGradient>

    <radialGradient id="glowTL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Chip body + position-tinted border -->
    <linearGradient id="chipFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111f31"/>
      <stop offset="100%" stop-color="#0a1421"/>
    </linearGradient>
    <linearGradient id="chipStroke" gradientUnits="userSpaceOnUse" x1="30" y1="0" x2="1008" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="48%" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Pipeline colour ramp reused by the flowing connectors -->
    <linearGradient id="flowGrad" gradientUnits="userSpaceOnUse" x1="30" y1="0" x2="1008" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="48%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#0f2033" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="pglow" x="-260%" y="-260%" width="620%" height="620%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .lbl  { font-size: 12.5px; font-weight: 600; fill: #e8f2ff; letter-spacing: .2px; }
      .sub  { font-size: 8.6px;  fill: #7f97b4; letter-spacing: .2px; }
      .idx  { font-size: 8px;    fill: #4f6a88; letter-spacing: 1px;
              font-family: 'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace; }
      .brand{ font-size: 19px;   font-weight: 700; fill: #eaf4ff; letter-spacing: 3px; }
      .tagl { font-size: 9px;    fill: #6f8bab; letter-spacing: 3.5px; }
      .pill { font-size: 9px;    fill: #a9c4e0; letter-spacing: .6px; }
      .phase{ font-size: 10px;   font-weight: 600; letter-spacing: 2px; }
      .cap  { font-size: 10.5px; fill: #7f97b4; }
      .cap2 { font-size: 9.5px;  fill: #5c7590; }

      .flow-line { stroke-dasharray: 5 12; animation: dash 1s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -17; } }

      .particle { animation: travel 1.4s linear infinite; }
      @keyframes travel {
        0%   { transform: translateX(0);     opacity: 0; }
        12%  { opacity: 1; }
        88%  { opacity: 1; }
        100% { transform: translateX(31px);  opacity: 0; }
      }

      .halo { animation: halo 3.4s ease-in-out infinite; }
      @keyframes halo { 0%,100% { opacity: .12; } 50% { opacity: .38; } }

      .scan { animation: scan 3.4s ease-in-out infinite; }
      @keyframes scan { 0%,100% { opacity: 0; } 10% { opacity: .85; } 26% { opacity: 0; } }

      .beat { animation: beat 2.4s ease-in-out infinite; }
      @keyframes beat { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        .flow-line, .particle, .halo, .scan, .beat { animation: none; }
        .particle { opacity: .85; }
        .scan { opacity: 0; }
        .halo { opacity: .22; }
      }
    </style>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="1040" height="428" rx="20" fill="url(#bg)"/>
  <rect width="1040" height="428" rx="20" fill="url(#grid)" opacity="0.55"/>
  <ellipse cx="130" cy="40"  rx="340" ry="210" fill="url(#glowTL)"/>
  <ellipse cx="950" cy="404" rx="360" ry="200" fill="url(#glowBR)"/>
  <rect x="0.5" y="0.5" width="1039" height="427" rx="20" fill="none" stroke="#16283d" stroke-width="1"/>
  <path d="M30 74 H1010" stroke="#13253a" stroke-width="1"/>

  <!-- ===== Header ===== -->
  <circle class="beat" cx="40" cy="42" r="5" fill="#22d3ee" filter="url(#pglow)"/>
  <text class="brand" x="56" y="48">INTELLITRAFFIC</text>
  <text class="tagl"  x="57" y="66">END-TO-END DATA FLOW</text>

  <g>
    <rect x="742" y="33" width="86"  height="20" rx="10" fill="#0d1a2a" stroke="#1d3a55"/>
    <text class="pill" x="785" y="47" text-anchor="middle">LightGBM V2</text>
    <rect x="836" y="33" width="62"  height="20" rx="10" fill="#0d1a2a" stroke="#1d3a55"/>
    <text class="pill" x="867" y="47" text-anchor="middle">FastAPI</text>
    <rect x="906" y="33" width="62"  height="20" rx="10" fill="#0d1a2a" stroke="#1d3a55"/>
    <text class="pill" x="937" y="47" text-anchor="middle">Azure</text>
  </g>

  <!-- ===== Connectors (drawn first, behind chips) ===== -->
  <!-- c0 -->
  <line x1="138" y1="214" x2="170" y2="214" stroke="#16304a" stroke-width="2.6" stroke-linecap="round"/>
  <line class="flow-line" x1="138" y1="214" x2="169" y2="214" stroke="url(#flowGrad)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M168 209.5 L174 214 L168 218.5 Z" fill="#22d3ee" filter="url(#pglow)"/>
  <circle class="particle" cx="141" cy="214" r="2.8" fill="#a5f3fc" filter="url(#pglow)" style="animation-delay:0s"/>
  <circle class="particle" cx="141" cy="214" r="2.1" fill="#eafcff" filter="url(#pglow)" style="animation-delay:0.7s"/>
  <!-- c1 -->
  <line x1="283" y1="214" x2="315" y2="214" stroke="#16304a" stroke-width="2.6" stroke-linecap="round"/>
  <line class="flow-line" x1="283" y1="214" x2="314" y2="214" stroke="url(#flowGrad)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M313 209.5 L319 214 L313 218.5 Z" fill="#7dd3fc" filter="url(#pglow)"/>
  <circle class="particle" cx="286" cy="214" r="2.8" fill="#a5f3fc" filter="url(#pglow)" style="animation-delay:0.2s"/>
  <circle class="particle" cx="286" cy="214" r="2.1" fill="#eafcff" filter="url(#pglow)" style="animation-delay:0.9s"/>
  <!-- c2 -->
  <line x1="428" y1="214" x2="460" y2="214" stroke="#16304a" stroke-width="2.6" stroke-linecap="round"/>
  <line class="flow-line" x1="428" y1="214" x2="459" y2="214" stroke="url(#flowGrad)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M458 209.5 L464 214 L458 218.5 Z" fill="#a78bfa" filter="url(#pglow)"/>
  <circle class="particle" cx="431" cy="214" r="2.8" fill="#ddd6fe" filter="url(#pglow)" style="animation-delay:0.4s"/>
  <circle class="particle" cx="431" cy="214" r="2.1" fill="#f3efff" filter="url(#pglow)" style="animation-delay:1.1s"/>
  <!-- c3 -->
  <line x1="573" y1="214" x2="605" y2="214" stroke="#16304a" stroke-width="2.6" stroke-linecap="round"/>
  <line class="flow-line" x1="573" y1="214" x2="604" y2="214" stroke="url(#flowGrad)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M603 209.5 L609 214 L603 218.5 Z" fill="#a78bfa" filter="url(#pglow)"/>
  <circle class="particle" cx="576" cy="214" r="2.8" fill="#ddd6fe" filter="url(#pglow)" style="animation-delay:0.6s"/>
  <circle class="particle" cx="576" cy="214" r="2.1" fill="#f3efff" filter="url(#pglow)" style="animation-delay:1.3s"/>
  <!-- c4 -->
  <line x1="718" y1="214" x2="750" y2="214" stroke="#16304a" stroke-width="2.6" stroke-linecap="round"/>
  <line class="flow-line" x1="718" y1="214" x2="749" y2="214" stroke="url(#flowGrad)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M748 209.5 L754 214 L748 218.5 Z" fill="#38bdf8" filter="url(#pglow)"/>
  <circle class="particle" cx="721" cy="214" r="2.8" fill="#bae6fd" filter="url(#pglow)" style="animation-delay:0.8s"/>
  <circle class="particle" cx="721" cy="214" r="2.1" fill="#eaf7ff" filter="url(#pglow)" style="animation-delay:1.5s"/>
  <!-- c5 -->
  <line x1="863" y1="214" x2="895" y2="214" stroke="#16304a" stroke-width="2.6" stroke-linecap="round"/>
  <line class="flow-line" x1="863" y1="214" x2="894" y2="214" stroke="url(#flowGrad)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M893 209.5 L899 214 L893 218.5 Z" fill="#38bdf8" filter="url(#pglow)"/>
  <circle class="particle" cx="866" cy="214" r="2.8" fill="#bae6fd" filter="url(#pglow)" style="animation-delay:1.0s"/>
  <circle class="particle" cx="866" cy="214" r="2.1" fill="#eaf7ff" filter="url(#pglow)" style="animation-delay:1.7s"/>

  <!-- ===== Chips ===== -->
  <!-- 1. PeMS Traffic -->
  <g>
    <rect class="halo" x="26" y="178" width="116" height="72" rx="19" fill="#22d3ee" filter="url(#soft)" style="animation-delay:0s"/>
    <rect x="30" y="182" width="108" height="64" rx="15" fill="url(#chipFill)" stroke="url(#chipStroke)" stroke-width="1.2"/>
    <path d="M48 182.9 H120" stroke="#22d3ee" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <rect class="scan" x="30" y="182" width="108" height="64" rx="15" fill="none" stroke="#22d3ee" stroke-width="1.6" opacity="0" style="animation-delay:0s"/>
    <text class="idx" x="41" y="197">01</text>
    <g transform="translate(84,202)" stroke="#22d3ee" stroke-width="1.6" fill="none" stroke-linecap="round">
      <path d="M-8 -9 L-4 9"/><path d="M8 -9 L4 9"/>
      <path d="M0 -6 v3 M0 -1 v3 M0 4 v3" stroke-width="1.3"/>
    </g>
    <text class="lbl" x="84" y="227" text-anchor="middle">PeMS Traffic</text>
    <text class="sub" x="84" y="240" text-anchor="middle">Real sensor data</text>
  </g>

  <!-- 2. Weather Data -->
  <g>
    <rect class="halo" x="171" y="178" width="116" height="72" rx="19" fill="#22d3ee" filter="url(#soft)" style="animation-delay:0.28s"/>
    <rect x="175" y="182" width="108" height="64" rx="15" fill="url(#chipFill)" stroke="url(#chipStroke)" stroke-width="1.2"/>
    <path d="M193 182.9 H265" stroke="#22d3ee" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <rect class="scan" x="175" y="182" width="108" height="64" rx="15" fill="none" stroke="#22d3ee" stroke-width="1.6" opacity="0" style="animation-delay:0.28s"/>
    <text class="idx" x="186" y="197">02</text>
    <g transform="translate(229,201)" fill="#22d3ee">
      <circle cx="-4" cy="1" r="4"/><circle cx="1" cy="-2.5" r="5"/><circle cx="6" cy="1" r="3.6"/>
      <rect x="-8" y="1" width="15" height="4.6" rx="2.3"/>
    </g>
    <text class="lbl" x="229" y="227" text-anchor="middle">Weather Data</text>
    <text class="sub" x="229" y="240" text-anchor="middle">Open-Meteo archive</text>
  </g>

  <!-- 3. Features -->
  <g>
    <rect class="halo" x="316" y="178" width="116" height="72" rx="19" fill="#a78bfa" filter="url(#soft)" style="animation-delay:0.56s"/>
    <rect x="320" y="182" width="108" height="64" rx="15" fill="url(#chipFill)" stroke="url(#chipStroke)" stroke-width="1.2"/>
    <path d="M338 182.9 H410" stroke="#a78bfa" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <rect class="scan" x="320" y="182" width="108" height="64" rx="15" fill="none" stroke="#a78bfa" stroke-width="1.6" opacity="0" style="animation-delay:0.56s"/>
    <text class="idx" x="331" y="197">03</text>
    <g transform="translate(374,201)" fill="#a78bfa">
      <rect x="-8" y="-1" width="3.6" height="9" rx="1"/>
      <rect x="-1.8" y="-8" width="3.6" height="16" rx="1"/>
      <rect x="4.4" y="-4" width="3.6" height="12" rx="1"/>
    </g>
    <text class="lbl" x="374" y="227" text-anchor="middle">Features</text>
    <text class="sub" x="374" y="240" text-anchor="middle">20 model inputs</text>
  </g>

  <!-- 4. LightGBM V2 -->
  <g>
    <rect class="halo" x="461" y="178" width="116" height="72" rx="19" fill="#a78bfa" filter="url(#soft)" style="animation-delay:0.84s"/>
    <rect x="465" y="182" width="108" height="64" rx="15" fill="url(#chipFill)" stroke="url(#chipStroke)" stroke-width="1.2"/>
    <path d="M483 182.9 H555" stroke="#a78bfa" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <rect class="scan" x="465" y="182" width="108" height="64" rx="15" fill="none" stroke="#a78bfa" stroke-width="1.6" opacity="0" style="animation-delay:0.84s"/>
    <text class="idx" x="476" y="197">04</text>
    <g transform="translate(519,201)" stroke="#a78bfa" stroke-width="1.5" fill="#0a1421" stroke-linecap="round">
      <path d="M0 -4 L-5.5 3 M0 -4 L5.5 3" fill="none"/>
      <circle cx="0" cy="-6.5" r="2.4"/><circle cx="-5.5" cy="4.5" r="2.4"/><circle cx="5.5" cy="4.5" r="2.4"/>
    </g>
    <text class="lbl" x="519" y="227" text-anchor="middle">LightGBM V2</text>
    <text class="sub" x="519" y="240" text-anchor="middle">Gradient boosting</text>
  </g>

  <!-- 5. FastAPI -->
  <g>
    <rect class="halo" x="606" y="178" width="116" height="72" rx="19" fill="#38bdf8" filter="url(#soft)" style="animation-delay:1.12s"/>
    <rect x="610" y="182" width="108" height="64" rx="15" fill="url(#chipFill)" stroke="url(#chipStroke)" stroke-width="1.2"/>
    <path d="M628 182.9 H700" stroke="#38bdf8" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <rect class="scan" x="610" y="182" width="108" height="64" rx="15" fill="none" stroke="#38bdf8" stroke-width="1.6" opacity="0" style="animation-delay:1.12s"/>
    <text class="idx" x="621" y="197">05</text>
    <path transform="translate(664,201)" d="M1.5 -9 L-6 1.5 h4.5 L-1 9 L6.5 -2 H2 Z" fill="#38bdf8"/>
    <text class="lbl" x="664" y="227" text-anchor="middle">FastAPI</text>
    <text class="sub" x="664" y="240" text-anchor="middle">Prediction API</text>
  </g>

  <!-- 6. Frontend -->
  <g>
    <rect class="halo" x="751" y="178" width="116" height="72" rx="19" fill="#38bdf8" filter="url(#soft)" style="animation-delay:1.4s"/>
    <rect x="755" y="182" width="108" height="64" rx="15" fill="url(#chipFill)" stroke="url(#chipStroke)" stroke-width="1.2"/>
    <path d="M773 182.9 H845" stroke="#38bdf8" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <rect class="scan" x="755" y="182" width="108" height="64" rx="15" fill="none" stroke="#38bdf8" stroke-width="1.6" opacity="0" style="animation-delay:1.4s"/>
    <text class="idx" x="766" y="197">06</text>
    <g transform="translate(809,201)" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round">
      <rect x="-8.5" y="-7" width="17" height="14" rx="2.5"/>
      <path d="M-8.5 -2.5 H8.5"/>
      <circle cx="-5.5" cy="-4.7" r="0.9" fill="#38bdf8" stroke="none"/>
    </g>
    <text class="lbl" x="809" y="227" text-anchor="middle">Frontend</text>
    <text class="sub" x="809" y="240" text-anchor="middle">Vite · Vanilla JS</text>
  </g>

  <!-- 7. Traffic Map -->
  <g>
    <rect class="halo" x="896" y="178" width="116" height="72" rx="19" fill="#38bdf8" filter="url(#soft)" style="animation-delay:1.68s"/>
    <rect x="900" y="182" width="108" height="64" rx="15" fill="url(#chipFill)" stroke="url(#chipStroke)" stroke-width="1.2"/>
    <path d="M918 182.9 H990" stroke="#38bdf8" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <rect class="scan" x="900" y="182" width="108" height="64" rx="15" fill="none" stroke="#38bdf8" stroke-width="1.6" opacity="0" style="animation-delay:1.68s"/>
    <text class="idx" x="911" y="197">07</text>
    <g transform="translate(954,201)">
      <path d="M0 8.5 C0 8.5 -6.5 1 -6.5 -2.5 a6.5 6.5 0 0 1 13 0 C6.5 1 0 8.5 0 8.5 Z"
            fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="0" cy="-2.5" r="2.4" fill="#38bdf8"/>
    </g>
    <text class="lbl" x="954" y="227" text-anchor="middle">Traffic Map</text>
    <text class="sub" x="954" y="240" text-anchor="middle">Leaflet · real PeMS</text>
  </g>

  <!-- ===== Phase brackets ===== -->
  <g stroke-linecap="round">
    <path d="M30 276 v6 H283 v-6" fill="none" stroke="#1d3a55" stroke-width="1.4"/>
    <rect x="108" y="271" width="98" height="18" rx="9" fill="#0a1524" stroke="#1d3a55"/>
    <text class="phase" x="157" y="284" text-anchor="middle" fill="#22d3ee">01 · INGEST</text>

    <path d="M320 276 v6 H573 v-6" fill="none" stroke="#1d3a55" stroke-width="1.4"/>
    <rect x="398" y="271" width="98" height="18" rx="9" fill="#0a1524" stroke="#1d3a55"/>
    <text class="phase" x="447" y="284" text-anchor="middle" fill="#a78bfa">02 · LEARN</text>

    <path d="M610 276 v6 H1008 v-6" fill="none" stroke="#1d3a55" stroke-width="1.4"/>
    <rect x="760" y="271" width="98" height="18" rx="9" fill="#0a1524" stroke="#1d3a55"/>
    <text class="phase" x="809" y="284" text-anchor="middle" fill="#38bdf8">03 · SERVE</text>
  </g>

  <!-- ===== Footer caption ===== -->
  <path d="M30 338 H1010" stroke="#13253a" stroke-width="1"/>
  <circle class="beat" cx="36" cy="364" r="3.5" fill="#22d3ee" filter="url(#pglow)"/>
  <text class="cap"  x="50" y="368">Real PeMS + weather data &#8594; 20-feature vector &#8594; LightGBM V2 &#8594; FastAPI &#8594; Vite + Leaflet map.</text>
  <text class="cap2" x="50" y="388">Historical 2017&#8211;2021 observations power the model; requested 2026&#8211;2030 dates map onto that history.</text>

</svg>
