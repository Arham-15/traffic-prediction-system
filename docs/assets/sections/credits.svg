<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1040 84" width="1040" height="84" role="img" aria-label="Credits">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050c18"/><stop offset=".6" stop-color="#0a1426"/><stop offset="1" stop-color="#150f2b"/></linearGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1e3a5f" stroke-opacity=".25" stroke-width=".6"/></pattern>
<filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="blur3" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="30"/></filter>
<clipPath id="clip"><rect width="1040" height="84" rx="22"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif}
.mono{font-family:'SFMono-Regular',Consolas,Menlo,'Liberation Mono',monospace}
@keyframes pulse{0%,100%{stroke-opacity:.55}50%{stroke-opacity:1}}
@keyframes glow{0%,100%{opacity:.15}50%{opacity:.5}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes dash{to{stroke-dashoffset:-20}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.pulse{animation:pulse 3s ease-in-out infinite}
.glow{animation:glow 3s ease-in-out infinite}
.rise{animation:rise .9s ease-out both}
.flow{stroke-dasharray:4 6;animation:dash 1.2s linear infinite}
.blink{animation:blink 2s ease-in-out infinite}
</style>
<g clip-path="url(#clip)">
<rect width="1040" height="84" fill="url(#bg)"/>
<rect width="1040" height="84" fill="url(#grid)"/>
<ellipse cx="160" cy="70" rx="260" ry="110" fill="#22d3ee" opacity=".08" filter="url(#blur3)"><animateTransform attributeName="transform" type="translate" values="0 0;70 30;0 0" dur="14s" repeatCount="indefinite"/></ellipse>
<ellipse cx="900" cy="4" rx="260" ry="110" fill="#a78bfa" opacity=".10" filter="url(#blur3)"><animateTransform attributeName="transform" type="translate" values="0 0;-70 -30;0 0" dur="16s" repeatCount="indefinite"/></ellipse>
<circle cx="52" cy="42" r="26" fill="#22d3ee" opacity=".35" filter="url(#blur)" class="glow"/><circle cx="52" cy="42" r="22" fill="#0b1a2e" stroke="#22d3ee" stroke-width="1.5" class="pulse"/><g transform="translate(41.2,31.2) scale(0.9)" fill="none" stroke="#22d3ee" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></g><text x="92" y="30" font-size="10" fill="#22d3ee" class="mono" letter-spacing="2">19</text><text x="92" y="52" font-size="20" font-weight="700" letter-spacing="3" fill="#f1f7ff">CREDITS</text><text x="92" y="69" font-size="10.5" fill="#6b84a6" letter-spacing=".5">Project Lead &amp; Team</text><path id="p68" d="M610 42 C 700 42 720 20 800 42 S 940 64 1002 42" fill="none" stroke="#22d3ee" stroke-opacity=".5" stroke-width="1.4" class="flow"/><circle r="6" fill="#22d3ee" opacity=".35"><animateMotion dur="3.2s" begin="0.0s" repeatCount="indefinite"><mpath xlink:href="#p68" href="#p68"/></animateMotion></circle><circle r="2.8" fill="#fff"><animateMotion dur="3.2s" begin="0.0s" repeatCount="indefinite"><mpath xlink:href="#p68" href="#p68"/></animateMotion></circle><circle r="6" fill="#22d3ee" opacity=".35"><animateMotion dur="3.2s" begin="-1.6s" repeatCount="indefinite"><mpath xlink:href="#p68" href="#p68"/></animateMotion></circle><circle r="2.8" fill="#fff"><animateMotion dur="3.2s" begin="-1.6s" repeatCount="indefinite"><mpath xlink:href="#p68" href="#p68"/></animateMotion></circle><circle cx="1002" cy="42" r="9" fill="#22d3ee" opacity=".35" class="glow"/><circle cx="1002" cy="42" r="4.5" fill="#22d3ee"/></g><rect x=".5" y=".5" width="1039" height="83" rx="22" fill="none" stroke="#2a4a73" stroke-opacity=".8"/></svg>