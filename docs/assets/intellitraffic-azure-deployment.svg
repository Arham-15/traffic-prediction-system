<ellipse cx="900" cy="410" rx="260" ry="110" fill="#a78bfa" opacity=".10" filter="url(#blur3)"><animateTransform attributeName="transform" type="translate" values="0 0;-70 -30;0 0" dur="16s" repeatCount="indefinite"/></ellipse>
